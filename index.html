/* v1.13.0: set night colors before first paint (no flash) and, on the board route, drop the manifest early so iPadOS
   Add to Home Screen saves this exact URL. Mirrors boardNight()/isNight() in app.js (default window when settings
   aren't loaded yet). */
(function () { try {
  var d = document.documentElement, h = new Date().getHours(), board = /[?&]board\b/.test(location.search), p, n;
  if (board) { d.className += ' boardmode'; p = localStorage.getItem('mt-board-night') || 'auto'; n = p === 'on' || (p === 'auto' && (h >= 21 || h < 7)); }
  else { p = localStorage.getItem('mt-night') || 'auto'; n = p === 'on' || (p === 'auto' && (h >= 21 || h < 7)); }
  if (n) { d.setAttribute('data-night', ''); d.style.background = '#0d0504'; }
  if (board) { var m = document.querySelector('link[rel=manifest]'); if (m) m.parentNode.removeChild(m); }
} catch (e) {} })();
